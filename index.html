<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEDSEC // ACESSO AO SISTEMA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #00ff66;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      text-align: center;
    }
    h1 {
      color: #ff0055;
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-shadow: 1px 1px #00ffff;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background: #000;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: inherit;
      text-align: center;
      outline: none;
    }
    input:focus {
      box-shadow: 0 0 5px #00ff66;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ff0055;
      color: #fff;
      border: none;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:hover {
      background: #00ffff;
      color: #000;
      box-shadow: 0 0 10px #00ffff;
    }
    #msg {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ff0055;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>// ACESSO_RESTRITO</h1>
    <p style="margin-bottom: 15px; font-size: 0.85rem; color: #ccc;">DIGITE A SENHA DE ACESSO:</p>
    
    <input type="password" id="senhaInput" placeholder="S E N H A">
    <button onclick="validarAcesso()">ENTRAR</button>
    
    <div id="msg"></div>
  </div>

  <script>
    function validarAcesso() {
      const senhaCorreta = "2009"; // Altere para a senha que desejar
      const senhaDigitada = document.getElementById("senhaInput").value;
      const msg = document.getElementById("msg");

      if (senhaDigitada === senhaCorreta) {
        // Grava a autorização na sessão do navegador
        sessionStorage.setItem("logado", "true");
        window.location.href = "dashboard.html";
      } else {
        msg.innerText = "ACESSO NEGADO: SENHA INCORRETA";
      }
    }

    // Permite apertar Enter para entrar
    document.getElementById("senhaInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        validarAcesso();
      }
    });
  </script>

</body>
</html>
